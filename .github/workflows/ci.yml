# GMS continuous integration: every test suite against a disposable PostgreSQL 16 service.
# Nothing is deployed from here. No secrets are needed: all credentials below are throwaway CI values.
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: gms_test_only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      GMS_TEST_ADMIN_URL: postgresql://postgres:gms_test_only@127.0.0.1:5432/postgres
    defaults: {run: {working-directory: services/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: PostgreSQL 16 client (pg_dump/pg_restore must match the server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-16
          echo "GMS_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]" pypdf pymupdf
      - run: python -m ruff check app --select E,F,W,B,UP --ignore E501,UP017,UP035,B008
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: gms_test_only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      E2E_ADMIN_URL: postgresql://postgres:gms_test_only@127.0.0.1:5432/postgres
      E2E_PYTHON: ../../services/api/.venv/bin/python
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/admin-web/package-lock.json}
      - run: python -m venv services/api/.venv && services/api/.venv/bin/pip install -e "services/api"
      - working-directory: apps/admin-web
        run: |
          npm ci
          npx tsc --noEmit
          npx next build
          npx playwright install --with-deps chromium
          npx playwright test

  mobile:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/field-mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.50.0"}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with: {name: gms-field-debug-apk, path: apps/field-mobile/build/app/outputs/flutter-apk/app-debug.apk}
